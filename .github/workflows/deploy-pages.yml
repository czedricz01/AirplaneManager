name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Feature branches get the build and the type check, but never a deployment.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deployments instead of cancelling them: interrupting a Pages deployment
# half way through can leave the live site in a broken state.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build static site
        run: npm run build:pages
        env:
          # Supplied from repository secrets. Both are baked into the bundle at
          # build time, which is how Supabase is designed to work from a static
          # site: the anon key is a public identifier and the database's Row
          # Level Security policies are what actually restrict access.
          # Without them the site still builds and runs, with accounts and cloud
          # savegames switched off.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Stops GitHub Pages running the output through Jekyll.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # The github-pages environment only accepts deployments from the default
    # branch, so anything else would fail this job with a protection-rule error.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
